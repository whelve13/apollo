# Test Profile Configuration (H2 In-Memory)
spring.application.name=apollo-test
spring.datasource.url=jdbc:h2:mem:apollo_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
